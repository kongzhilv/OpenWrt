name: Build OpenWrt F50 WiFi SFTP ttyd Argon OpenList DiskMan Lucky TurboACC NoSFE F2FS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - make
      - fix-rax3000m-emmc-target
    paths-ignore:
      - "*.md"
      - "LICENSE"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.1
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"
  STRICT_MANIFEST_CHECK: "false"
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build-f50-lucky-turboacc-nosfe-f2fs
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          mkdir -p logs release-files diagnostics
          {
            echo "===== Check required files ====="
            date
            pwd
            ls -lah
            test -f "$CONFIG_FILE"
            test -f "$DIY_P1_SH"
            test -f "$DIY_P2_SH"
          } 2>&1 | tee logs/00_check_required_files.log

      - name: Prepare folders
        run: |
          {
            echo "===== Prepare folders ====="
            date
            mkdir -p logs release-files diagnostics
            df -h
          } 2>&1 | tee logs/01_prepare_folders.log

      - name: Free disk space
        timeout-minutes: 15
        run: |
          {
            echo "===== Free disk space ====="
            date

            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL || true

            docker image prune --all --force || true

            sudo timedatectl set-timezone "$TZ" || true
            df -h
          } 2>&1 | tee logs/02_free_disk.log

      - name: Install build dependencies
        timeout-minutes: 60
        run: |
          {
            echo "===== Install build dependencies ====="
            date

            sudo apt-get update
            sudo apt-get -y install \
              build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip \
              zlib1g-dev file wget curl swig python3-dev qemu-utils libfuse-dev

            df -h
          } 2>&1 | tee logs/03_install_deps.log

      - name: Clone OpenWrt source
        run: |
          {
            echo "===== Clone OpenWrt source ====="
            date
            git clone -b "$REPO_BRANCH" --depth 1 "$REPO_URL" openwrt
            cd openwrt
            git log -1 --oneline
            git status --short
          } 2>&1 | tee logs/04_clone_source.log

      - name: DIY part 1
        run: |
          {
            echo "===== DIY part1 ====="
            date
            chmod +x "$DIY_P1_SH"
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          } 2>&1 | tee logs/05_diy_part1.log

      - name: Update feeds
        run: |
          {
            echo "===== Update feeds ====="
            date
            cd openwrt
            ./scripts/feeds update -a
          } 2>&1 | tee logs/06_feeds_update.log

      - name: Install feeds
        run: |
          {
            echo "===== Install feeds ====="
            date
            cd openwrt
            ./scripts/feeds install -a
          } 2>&1 | tee logs/07_feeds_install.log

      - name: DIY part 2 and defconfig
        run: |
          {
            echo "===== DIY part2 + defconfig ====="
            date

            chmod +x "$DIY_P2_SH"
            cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config

            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P2_SH"

            echo "===== Force refresh OpenWrt package metadata ====="
            rm -rf tmp

            echo "===== Generate defconfig ====="
            make defconfig V=s

            echo "===== Save final config ====="
            cp -f .config "$GITHUB_WORKSPACE/logs/08_final.config"

            echo "===== Check important packages in generated package index ====="
            grep -R "luci-app-diskman" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "luci-i18n-diskman" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "luci-app-lucky" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "luci-app-turboacc" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "nft-fullcone" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "shortcut-fe" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "f2fs" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "mkf2fs" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "libf2fs6" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true
            grep -R "luci-app-eqosplus" tmp/.packageinfo tmp/.config-package.in tmp/.config-package.in.* 2>/dev/null || true

            echo "===== Check important packages in final .config ====="
            grep -E 'CONFIG_PACKAGE_(luci-app-diskman|luci-i18n-diskman|lucky|luci-app-lucky|luci-app-turboacc|kmod-nft-offload|kmod-tcp-bbr|kmod-nft-fullcone|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|libf2fs6|luci-app-eqosplus|kmod-ifb|tc-tiny|nftables-json|bc|shortcut-fe|fast-classifier)' .config || true
            grep -E '^# CONFIG_PACKAGE_(luci-app-diskman|luci-i18n-diskman|lucky|luci-app-lucky|luci-app-turboacc|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|libf2fs6|luci-app-eqosplus|kmod-ifb|tc-tiny|nftables-json|bc|shortcut-fe|fast-classifier)' .config || true

            if ! grep -q '^CONFIG_PACKAGE_luci-app-diskman=y' .config; then
              echo "ERROR: luci-app-diskman still not selected after package metadata refresh"
              find package/luci-app-diskman -maxdepth 5 -type f | sort || true
              sed -n '1,220p' package/luci-app-diskman/Makefile || true
              grep -R "diskman" tmp 2>/dev/null | head -200 || true
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_luci-app-lucky=y' .config; then
              echo "ERROR: luci-app-lucky not selected"
              find package/lucky -maxdepth 5 -type f | sort || true
              grep -R "luci-app-lucky" tmp 2>/dev/null | head -200 || true
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_lucky=y' .config; then
              echo "ERROR: lucky core package not selected"
              find package/lucky -maxdepth 5 -type f | sort || true
              grep -R "Package: lucky" tmp/.packageinfo 2>/dev/null || true
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc=y' .config; then
              echo "ERROR: luci-app-turboacc not selected"
              find package/turboacc -maxdepth 6 -type f | sort || true
              grep -R "luci-app-turboacc" tmp 2>/dev/null | head -200 || true
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y' .config; then
              echo "ERROR: Turbo ACC Flow Offload option not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y' .config; then
              echo "ERROR: Turbo ACC BBR option not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE=y' .config; then
              echo "ERROR: Turbo ACC NFT FullCone option not selected"
              exit 1
            fi

            if grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE=y' .config; then
              echo "ERROR: Shortcut-FE must be disabled in Turbo ACC no-SFE build"
              exit 1
            fi

            if grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM=y' .config; then
              echo "ERROR: Shortcut-FE CM must be disabled in Turbo ACC no-SFE build"
              exit 1
            fi

            if grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_DRV=y' .config; then
              echo "ERROR: Shortcut-FE ECM/DRV must be disabled in Turbo ACC no-SFE build"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_kmod-fs-f2fs=y' .config; then
              echo "ERROR: kmod-fs-f2fs not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_f2fs-tools=y' .config; then
              echo "ERROR: f2fs-tools not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_f2fsck=y' .config; then
              echo "ERROR: f2fsck not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_mkf2fs=y' .config; then
              echo "ERROR: mkf2fs not selected"
              exit 1
            fi

            if ! grep -q '^CONFIG_PACKAGE_libf2fs6=y' .config; then
              echo "ERROR: libf2fs6 not selected"
              exit 1
            fi

            echo "===== Ensure EQOS Plus is disabled ====="
            if grep -q '^CONFIG_PACKAGE_luci-app-eqosplus=y' .config; then
              echo "ERROR: luci-app-eqosplus must be disabled"
              exit 1
            fi
            if grep -q '^CONFIG_PACKAGE_kmod-ifb=y' .config; then
              echo "ERROR: kmod-ifb must be disabled"
              exit 1
            fi
            if grep -q '^CONFIG_PACKAGE_tc-tiny=y' .config; then
              echo "ERROR: tc-tiny must be disabled"
              exit 1
            fi
            if grep -q '^CONFIG_PACKAGE_bc=y' .config; then
              echo "ERROR: bc must be disabled"
              exit 1
            fi

            echo "===== Note ====="
            echo "nftables-json is allowed because firewall4/base system may select it."
          } 2>&1 | tee logs/08_diy_part2_and_defconfig.log

      - name: Validate final config
        run: |
          {
            echo "===== Validate final config ====="
            date
            cd openwrt

            echo "===== Target ====="
            grep -E '^CONFIG_TARGET_.*=y|^CONFIG_TARGET_(BOARD|SUBTARGET|PROFILE)=' .config || true

            grep -q '^CONFIG_TARGET_mediatek=y' .config
            grep -q '^CONFIG_TARGET_mediatek_filogic=y' .config
            grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m=y' .config
            grep -q '^CONFIG_TARGET_ROOTFS_SQUASHFS=y' .config

            echo "===== Must not be OpenWrt One ====="
            ! grep -q '^CONFIG_TARGET_mediatek_filogic_DEVICE_openwrt_one=y' .config
            ! grep -q '^CONFIG_TARGET_PROFILE="DEVICE_openwrt_one"' .config

            echo "===== Required base packages ====="
            grep -q '^CONFIG_PACKAGE_luci=y' .config
            grep -q '^CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' .config
            grep -q '^CONFIG_PACKAGE_openssh-sftp-server=y' .config

            echo "===== Required Argon package ====="
            grep -q '^CONFIG_PACKAGE_luci-theme-argon=y' .config
            test -d package/luci-theme-argon
            test -f files/etc/uci-defaults/02-set-argon-theme
            grep -q "/luci-static/argon" files/etc/uci-defaults/02-set-argon-theme

            echo "===== Required OpenList package ====="
            test -d package/openlist
            test -d feeds/packages/lang/golang
            grep -q '^CONFIG_PACKAGE_openlist=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-openlist=y' .config
            grep -q '^CONFIG_PACKAGE_luci-i18n-openlist-zh-cn=y' .config

            echo "===== Required Lucky packages ====="
            grep -q '^CONFIG_PACKAGE_lucky=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-lucky=y' .config

            echo "===== Required Turbo ACC no-SFE packages ====="
            grep -q '^CONFIG_PACKAGE_luci-app-turboacc=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-tcp-bbr=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-nft-fullcone=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_DRV=y' .config
            test -d package/turboacc
            test -f package/turboacc/luci-app-turboacc/Makefile
            test -f package/turboacc/nft-fullcone/Makefile

            echo "===== Required F2FS packages for /dev/fitrw overlay ====="
            grep -q '^CONFIG_PACKAGE_kmod-fs-f2fs=y' .config
            grep -q '^CONFIG_PACKAGE_f2fs-tools=y' .config
            grep -q '^CONFIG_PACKAGE_f2fsck=y' .config
            grep -q '^CONFIG_PACKAGE_mkf2fs=y' .config
            grep -q '^CONFIG_PACKAGE_libf2fs6=y' .config

            echo "===== Ensure EQOS Plus disabled ====="
            ! grep -q '^CONFIG_PACKAGE_luci-app-eqosplus=y' .config
            ! grep -q '^CONFIG_PACKAGE_kmod-ifb=y' .config
            ! grep -q '^CONFIG_PACKAGE_tc-tiny=y' .config
            ! grep -q '^CONFIG_PACKAGE_bc=y' .config

            echo "===== Note ====="
            echo "nftables-json is allowed because it can be selected by firewall4/base system."

            echo "===== Required fixed minimal DiskMan package ====="
            grep -E 'CONFIG_PACKAGE_(luci-app-diskman|luci-i18n-diskman|luci-compat|luci-lua-runtime|luci-lib-base|luci-lib-nixio|luci-lib-ip|luci-lib-jsonc|luci-lib-ipkg|lua|libubus-lua|liblucihttp-lua|ucode-mod-lua|parted|lsblk|e2fsprogs|f2fs-tools|f2fsck|mkf2fs|libf2fs6|smartmontools|kmod-fs-ext4|kmod-fs-f2fs|mount-utils)' .config || true

            require_config() {
              local key="$1"

              if grep -q "^${key}=y" .config; then
                echo "OK: ${key}=y"
              else
                echo "ERROR: missing ${key}=y"
                echo "----- matched lines for ${key} -----"
                grep -E "^${key}=|^# ${key} is not set" .config || true
                exit 1
              fi
            }

            test -d package/luci-app-diskman
            test -d package/lucky
            test -d package/turboacc
            test ! -d package/luci-app-eqosplus

            require_config CONFIG_PACKAGE_luci-app-diskman
            require_config CONFIG_PACKAGE_luci-i18n-diskman-zh-cn
            require_config CONFIG_PACKAGE_luci-compat
            require_config CONFIG_PACKAGE_luci-lua-runtime
            require_config CONFIG_PACKAGE_luci-lib-base
            require_config CONFIG_PACKAGE_luci-lib-nixio
            require_config CONFIG_PACKAGE_luci-lib-ip
            require_config CONFIG_PACKAGE_luci-lib-jsonc
            require_config CONFIG_PACKAGE_luci-lib-ipkg
            require_config CONFIG_PACKAGE_lua
            require_config CONFIG_PACKAGE_libubus-lua
            require_config CONFIG_PACKAGE_liblucihttp-lua
            require_config CONFIG_PACKAGE_ucode-mod-lua
            require_config CONFIG_PACKAGE_parted
            require_config CONFIG_PACKAGE_fdisk
            require_config CONFIG_PACKAGE_blkid
            require_config CONFIG_PACKAGE_lsblk
            require_config CONFIG_PACKAGE_e2fsprogs
            require_config CONFIG_PACKAGE_kmod-fs-ext4
            require_config CONFIG_PACKAGE_kmod-fs-f2fs
            require_config CONFIG_PACKAGE_f2fs-tools
            require_config CONFIG_PACKAGE_f2fsck
            require_config CONFIG_PACKAGE_mkf2fs
            require_config CONFIG_PACKAGE_libf2fs6
            require_config CONFIG_PACKAGE_mount-utils
            require_config CONFIG_PACKAGE_smartmontools

            require_config CONFIG_PACKAGE_lucky
            require_config CONFIG_PACKAGE_luci-app-lucky

            require_config CONFIG_PACKAGE_luci-app-turboacc
            require_config CONFIG_PACKAGE_kmod-nft-offload
            require_config CONFIG_PACKAGE_kmod-tcp-bbr
            require_config CONFIG_PACKAGE_kmod-nft-fullcone

            echo "===== Required ttyd packages ====="
            grep -q '^CONFIG_PACKAGE_ttyd=y' .config
            grep -q '^CONFIG_PACKAGE_luci-app-ttyd=y' .config
            grep -q '^CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y' .config

            echo "===== Required common tools ====="
            grep -q '^CONFIG_PACKAGE_bash=y' .config
            grep -q '^CONFIG_PACKAGE_curl=y' .config
            grep -q '^CONFIG_PACKAGE_wget-ssl=y' .config
            grep -q '^CONFIG_PACKAGE_htop=y' .config
            grep -q '^CONFIG_PACKAGE_tcpdump=y' .config
            grep -q '^CONFIG_PACKAGE_iperf3=y' .config
            grep -q '^CONFIG_PACKAGE_mtr-json=y' .config
            grep -q '^CONFIG_PACKAGE_bind-dig=y' .config

            echo "===== Required WiFi packages ====="
            grep -q '^CONFIG_PACKAGE_kmod-mt76=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-mt7915e=y' .config
            grep -q '^CONFIG_PACKAGE_wpad-basic-mbedtls=y' .config
            grep -q '^CONFIG_PACKAGE_wireless-regdb=y' .config

            echo "===== Required F50 USB network packages ====="
            grep -q '^CONFIG_PACKAGE_usbutils=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-usb-net=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y' .config
            grep -q '^CONFIG_PACKAGE_kmod-usb-net-rndis=y' .config

            echo "===== Embedded files ====="
            find files -type f | sort
            test -f files/etc/uci-defaults/01-enable-wifi
            test -f files/etc/uci-defaults/02-set-argon-theme
            test -f files/etc/uci-defaults/03-disable-lucky-autostart
            test -f files/etc/uci-defaults/04-config-turboacc

            bad_files="$(find files -type f | sort | grep -v -E '^(files/etc/uci-defaults/01-enable-wifi|files/etc/uci-defaults/02-set-argon-theme|files/etc/uci-defaults/03-disable-lucky-autostart|files/etc/uci-defaults/04-config-turboacc)$' || true)"
            if [ -n "$bad_files" ]; then
              echo "ERROR: unexpected embedded files:"
              echo "$bad_files"
              exit 1
            fi

            echo "Validate passed."
          } 2>&1 | tee logs/09_validate_config.log

      - name: Download sources
        run: |
          {
            echo "===== Download sources ====="
            date
            cd openwrt
            make download -j8 V=s
          } 2>&1 | tee logs/10_download.log

      - name: Build OpenWrt
        run: |
          {
            echo "===== Build OpenWrt ====="
            date
            cd openwrt

            echo "===== First build: make -j4 V=s ====="
            set +e
            make -j4 V=s
            rc="$?"
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "===== make -j4 failed with rc=$rc, retry single thread ====="
              make -j1 V=s
            fi

            echo "===== Build done ====="
            date
          } 2>&1 | tee logs/11_compile.log

      - name: Disk usage and outputs
        if: ${{ always() }}
        run: |
          {
            echo "===== Disk usage and outputs ====="
            date
            df -h

            echo
            echo "===== Output files ====="
            find openwrt/bin/targets -type f 2>/dev/null | sort || true

            echo
            echo "===== Output sizes ====="
            find openwrt/bin/targets -type f -exec ls -lah {} \; 2>/dev/null | sort || true
          } 2>&1 | tee logs/12_outputs.log

      - name: Prepare firmware files
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        run: |
          {
            echo "===== Prepare firmware files ====="
            date
            mkdir -p release-files

            if [ -d openwrt/bin/targets ]; then
              find openwrt/bin/targets -type f \
                \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.itb" -o -name "*.manifest" -o -name "*.buildinfo" -o -name "*.json" -o -name "*.sha256sums" \) \
                -exec cp -f {} release-files/ \;
            fi

            echo "===== release-files ====="
            find release-files -type f -exec ls -lah {} \; 2>/dev/null | sort || true
          } 2>&1 | tee logs/13_prepare_firmware.log

      - name: Validate firmware manifest forbidden packages
        if: ${{ always() }}
        run: |
          {
            echo "===== Validate firmware manifest forbidden packages ====="
            date

            manifest="$(find release-files openwrt/bin/targets -type f -name '*.manifest' 2>/dev/null | head -n 1 || true)"

            if [ -z "$manifest" ]; then
              echo "::warning::manifest not found"
              find release-files openwrt/bin/targets -type f 2>/dev/null | sort || true
              exit 0
            fi

            echo "manifest=$manifest"

            echo "===== suspicious packages in manifest ====="
            grep -Ei 'diskman|lucky|turboacc|fullcone|offload|bbr|shortcut|fast-classifier|eqos|ifb|nftables|tc-tiny|rpcd-mod-file|btrfs|exfat|f2fs|ntfs|dosfstools|kmod-fs|usb-storage|block-mount|mount-utils' "$manifest" || true

            if grep -Eq '^(luci-app-eqosplus|kmod-ifb|tc-tiny|bc)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: EQOS Plus related package found in manifest:"
              grep -E '^(luci-app-eqosplus|kmod-ifb|tc-tiny|bc)([[:space:]-]|$)' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(lucky|luci-app-lucky)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: lucky packages not found in manifest"
              grep -Ei 'lucky' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(luci-app-turboacc)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: luci-app-turboacc not found in manifest"
              grep -Ei 'turboacc' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(kmod-nft-offload)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: kmod-nft-offload not found in manifest"
              grep -Ei 'offload' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(kmod-tcp-bbr)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: kmod-tcp-bbr not found in manifest"
              grep -Ei 'bbr' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(kmod-nft-fullcone)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: kmod-nft-fullcone not found in manifest"
              grep -Ei 'fullcone' "$manifest" || true
              exit 1
            fi

            if ! grep -Eq '^(kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|libf2fs6)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: F2FS required packages not found in manifest"
              grep -Ei 'f2fs|mkf2fs|libf2fs6' "$manifest" || true
              exit 1
            fi

            if grep -Eiq '^(kmod-fast-classifier|kmod-shortcut-fe|kmod-shortcut-fe-cm|kmod-shortcut-fe-drv)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: Shortcut-FE related package found in no-SFE manifest:"
              grep -Ei '^(kmod-fast-classifier|kmod-shortcut-fe|kmod-shortcut-fe-cm|kmod-shortcut-fe-drv)([[:space:]-]|$)' "$manifest" || true
              exit 1
            fi

            echo "===== Note ====="
            echo "nftables-json is allowed and is not treated as EQOS residue."

            forbidden='^(btrfs-progs|kmod-fs-btrfs|kmod-fs-exfat|kmod-fs-msdos|kmod-fs-ntfs3|kmod-fs-vfat|dosfstools|exfat-fsck|exfat-mkfs|ntfs-3g-utils|kmod-usb-storage|kmod-usb-storage-uas|block-mount)([[:space:]-]|$)'

            if grep -Eq "$forbidden" "$manifest"; then
              echo "::warning::forbidden-like packages found in firmware manifest:"
              grep -E "$forbidden" "$manifest" || true

              if [ "$STRICT_MANIFEST_CHECK" = "true" ]; then
                echo "STRICT_MANIFEST_CHECK=true, fail now."
                exit 1
              else
                echo "STRICT_MANIFEST_CHECK=false, treat as warning only."
              fi
            else
              echo "Manifest validate passed."
            fi
          } 2>&1 | tee logs/14_validate_manifest.log

      - name: Collect full diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p diagnostics/root diagnostics/openwrt diagnostics/openwrt/tmp diagnostics/openwrt/package diagnostics/openwrt/bin diagnostics/logs

          echo "===== Collect full diagnostics =====" | tee diagnostics/00_collect.log
          date | tee -a diagnostics/00_collect.log

          echo "===== Runner info =====" > diagnostics/root/runner_info.txt
          uname -a >> diagnostics/root/runner_info.txt 2>&1
          lsb_release -a >> diagnostics/root/runner_info.txt 2>&1
          df -h >> diagnostics/root/runner_info.txt 2>&1
          free -h >> diagnostics/root/runner_info.txt 2>&1
          env | sort >> diagnostics/root/env.txt 2>&1

          cp -a logs diagnostics/logs 2>/dev/null || true

          if [ -d openwrt ]; then
            cd openwrt

            echo "===== Git =====" > "$GITHUB_WORKSPACE/diagnostics/openwrt/git.txt"
            git log -1 --oneline >> "$GITHUB_WORKSPACE/diagnostics/openwrt/git.txt" 2>&1
            git status --short >> "$GITHUB_WORKSPACE/diagnostics/openwrt/git.txt" 2>&1

            cp -f .config "$GITHUB_WORKSPACE/diagnostics/openwrt/dot_config.txt" 2>/dev/null || true
            ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/diagnostics/openwrt/diffconfig.txt" 2>&1 || true

            cp -f feeds.conf.default "$GITHUB_WORKSPACE/diagnostics/openwrt/feeds.conf.default.txt" 2>/dev/null || true
            cp -f feeds.conf "$GITHUB_WORKSPACE/diagnostics/openwrt/feeds.conf.txt" 2>/dev/null || true

            cp -f tmp/.packageinfo "$GITHUB_WORKSPACE/diagnostics/openwrt/tmp/packageinfo.txt" 2>/dev/null || true
            cp -f tmp/.config-package.in "$GITHUB_WORKSPACE/diagnostics/openwrt/tmp/config-package.in.txt" 2>/dev/null || true
            cp -f tmp/.config-target.in "$GITHUB_WORKSPACE/diagnostics/openwrt/tmp/config-target.in.txt" 2>/dev/null || true

            {
              echo "===== grep important packages from .config ====="
              grep -E 'CONFIG_PACKAGE_(luci|rpcd|diskman|openlist|lucky|turboacc|fullcone|offload|bbr|shortcut|fast-classifier|eqos|ifb|tc-tiny|nftables-json|bc|ttyd|argon|parted|lsblk|e2fsprogs|f2fs-tools|f2fsck|mkf2fs|libf2fs6|smartmontools|kmod-fs-ext4|kmod-fs-f2fs|mount-utils)' .config || true
              echo
              echo "===== grep important packages from tmp/.packageinfo ====="
              grep -nE 'Package: (luci-app-diskman|luci-i18n-diskman|luci-app-lucky|lucky|luci-app-turboacc|kmod-nft-offload|kmod-tcp-bbr|kmod-nft-fullcone|luci-app-eqosplus|kmod-ifb|tc-tiny|nftables-json|bc|rpcd-mod-file|luci-base|kmod-fs-ext4|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|libf2fs6|mount-utils)|Depends:|Source-Makefile:.*(diskman|lucky|turboacc|fullcone|eqos|f2fs)' tmp/.packageinfo 2>/dev/null || true
            } > "$GITHUB_WORKSPACE/diagnostics/openwrt/package/important_package_grep.txt" 2>&1

            {
              echo "===== Third-party package files ====="
              find package/luci-theme-argon -maxdepth 6 -type f | sort || true
              find package/luci-app-diskman -maxdepth 6 -type f | sort || true
              find package/lucky -maxdepth 6 -type f | sort || true
              find package/turboacc -maxdepth 6 -type f | sort || true
              echo
              echo "===== Ensure no EQOS package directory ====="
              find package -maxdepth 3 -iname '*eqos*' -print || true
              echo
              echo "===== Ensure no Shortcut-FE package directory in no-SFE build ====="
              find package/turboacc -maxdepth 4 -iname '*shortcut*' -print || true
              echo
              echo "===== Argon Makefile ====="
              sed -n '1,220p' package/luci-theme-argon/Makefile 2>/dev/null || true
              echo
              echo "===== DiskMan Makefile ====="
              sed -n '1,260p' package/luci-app-diskman/Makefile 2>/dev/null || true
              echo
              echo "===== Lucky Makefiles ====="
              sed -n '1,220p' package/lucky/luci-app-lucky/Makefile 2>/dev/null || true
              sed -n '1,260p' package/lucky/lucky/Makefile 2>/dev/null || true
              echo
              echo "===== Turbo ACC Makefiles ====="
              sed -n '1,260p' package/turboacc/luci-app-turboacc/Makefile 2>/dev/null || true
              sed -n '1,260p' package/turboacc/nft-fullcone/Makefile 2>/dev/null || true
              echo
              echo "===== Embedded uci-defaults files ====="
              find files/etc/uci-defaults -maxdepth 1 -type f -print -exec sed -n '1,280p' {} \; 2>/dev/null || true
            } > "$GITHUB_WORKSPACE/diagnostics/openwrt/package/third_party_tree_and_makefiles.txt" 2>&1

            {
              echo "===== Output files ====="
              find bin/targets -type f -exec ls -lah {} \; 2>/dev/null | sort || true
              echo
              echo "===== Manifests ====="
              for f in $(find bin/targets -type f -name '*.manifest' 2>/dev/null | sort); do
                echo "----- $f -----"
                cat "$f"
              done
            } > "$GITHUB_WORKSPACE/diagnostics/openwrt/bin/outputs_and_manifests.txt" 2>&1

            mkdir -p "$GITHUB_WORKSPACE/diagnostics/openwrt/manifests"
            find bin/targets -type f -name '*.manifest' -exec cp -f {} "$GITHUB_WORKSPACE/diagnostics/openwrt/manifests/" \; 2>/dev/null || true

            {
              echo "===== build_dir failed stamps / logs ====="
              find build_dir -type f \
                \( -name '*.log' -o -name 'config.log' -o -name '.configured*' -o -name '.built*' -o -name '.pkgdir*' \) \
                2>/dev/null | sort | head -2000
            } > "$GITHUB_WORKSPACE/diagnostics/openwrt/build_dir_interesting_files.txt" 2>&1

            cd "$GITHUB_WORKSPACE"
          fi

          tar -czf OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz diagnostics logs release-files 2>/dev/null || true
          ls -lah OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz 2>/dev/null || true

      - name: Upload full diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Full_Diagnostics_${{ github.run_number }}
          path: |
            OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz
            diagnostics/**
            logs/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Upload firmware artifact
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Firmware_${{ github.run_number }}
          path: release-files/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Generate release tag
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' }}
        run: |
          echo "RELEASE_TAG=OpenWrt_F50_Lucky_TurboACC_NoSFE_F2FS_$(date +'%Y%m%d_%H%M%S')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            RAX3000M F50 build with Lucky, Turbo ACC no-SFE and F2FS /dev/fitrw support.

            Purpose:
            - Keep Lucky installed.
            - Disable Lucky autostart by uci-defaults.
            - Add Turbo ACC in no-SFE stable mode.
            - Enable Flow Offload, Hardware Flow Offload, FullCone NAT and BBR.
            - Keep Shortcut-FE disabled for first stability test.
            - Add F2FS tools required for /dev/fitrw persistent overlay.

            Included:
            - F50 basic USB Ethernet drivers
            - WiFi
            - SFTP
            - ttyd
            - luci-theme-argon
            - OpenList
            - patched minimal DiskMan LuCI package
            - DiskMan Lua LuCI runtime dependencies
            - ext4 support
            - F2FS support for existing /dev/fitrw persistent overlay
            - kmod-fs-f2fs
            - f2fs-tools
            - mkf2fs
            - f2fsck
            - libf2fs6
            - lucky
            - luci-app-lucky
            - uci-defaults/03-disable-lucky-autostart
            - Turbo ACC no-SFE
            - Flow Offload
            - Hardware Flow Offload
            - FullCone NAT
            - BBR CCA
            - uci-defaults/04-config-turboacc

            Notes:
            - Lucky is installed but disabled from boot.
            - Turbo ACC is installed in no-SFE mode.
            - Shortcut-FE / SFE is intentionally disabled for this stability build.
            - F2FS tools are included to avoid mkfs.f2fs missing during /dev/fitrw overlay initialization.
            - Full diagnostics are uploaded as a workflow artifact.
            - Manifest package warnings do not block artifact upload by default.
            - STRICT_MANIFEST_CHECK=false by default.
            - This build does not include /dev/fitrw format script.
            - This build does not include F50 automatic USB reprobe scripts.
            - WiFi uci-defaults script forces split SSID: OpenWrt_2G / OpenWrt_5G.
            - nftables-json may still exist because it can be selected by firewall4/base system; it is not treated as EQOS residue.

            Explicitly removed for this test:
            - luci-app-eqosplus
            - kmod-ifb
            - tc-tiny
            - bc
            - luci-app-argon-config
            - tempinfo / custom temperature LuCI JS
            - dark-line CSS patch
            - USB storage / UAS
            - block-mount
            - btrfs/exfat/ntfs tools and kmods
            - QMI / MBIM / usb-modeswitch / USB serial
            - manual extroot scripts
            - OpenClash
            - Docker
            - Shortcut-FE / SFE
          files: release-files/*
          draft: false
          prerelease: false
