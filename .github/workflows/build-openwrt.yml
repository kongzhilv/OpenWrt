name: Build OpenWrt F50 WiFi SFTP ttyd Argon OpenList DiskMan Lucky TurboACC NoSFE F2FS Monitor EQOS Temp

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - make
      - fix-rax3000m-emmc-target
    paths-ignore:
      - "*.md"
      - "LICENSE"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.1
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"
  STRICT_MANIFEST_CHECK: "false"
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build-f50-monitor-eqos-temp
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          mkdir -p logs release-files diagnostics
          {
            echo "===== Check required files ====="
            date
            pwd
            ls -lah
            test -f "$CONFIG_FILE"
            test -f "$DIY_P1_SH"
            test -f "$DIY_P2_SH"
          } 2>&1 | tee logs/00_check_required_files.log

      - name: Free disk space
        timeout-minutes: 15
        run: |
          {
            echo "===== Free disk space ====="
            date
            sudo rm -rf /usr/share/dotnet || true
            sudo rm -rf /usr/local/lib/android || true
            sudo rm -rf /opt/ghc || true
            sudo rm -rf /opt/hostedtoolcache/CodeQL || true
            docker image prune --all --force || true
            sudo timedatectl set-timezone "$TZ" || true
            df -h
          } 2>&1 | tee logs/01_free_disk.log

      - name: Install build dependencies
        timeout-minutes: 60
        run: |
          {
            echo "===== Install build dependencies ====="
            date
            sudo apt-get update
            sudo apt-get -y install \
              build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip \
              zlib1g-dev file wget curl swig python3-dev qemu-utils libfuse-dev
            df -h
          } 2>&1 | tee logs/02_install_deps.log

      - name: Clone OpenWrt source
        run: |
          {
            echo "===== Clone OpenWrt source ====="
            date
            git clone -b "$REPO_BRANCH" --depth 1 "$REPO_URL" openwrt
            cd openwrt
            git log -1 --oneline
            git status --short
          } 2>&1 | tee logs/03_clone_source.log

      - name: DIY part 1
        run: |
          {
            echo "===== DIY part1 ====="
            date
            chmod +x "$DIY_P1_SH"
            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P1_SH"
          } 2>&1 | tee logs/04_diy_part1.log

      - name: Update feeds
        run: |
          {
            echo "===== Update feeds ====="
            date
            cd openwrt
            ./scripts/feeds update -a
          } 2>&1 | tee logs/05_feeds_update.log

      - name: Install feeds
        run: |
          {
            echo "===== Install feeds ====="
            date
            cd openwrt
            ./scripts/feeds install -a
          } 2>&1 | tee logs/06_feeds_install.log

      - name: DIY part 2 and defconfig
        run: |
          {
            echo "===== DIY part2 + defconfig ====="
            date

            chmod +x "$DIY_P2_SH"
            cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config

            cd openwrt
            "$GITHUB_WORKSPACE/$DIY_P2_SH"

            echo "===== Force refresh OpenWrt package metadata ====="
            rm -rf tmp

            echo "===== Generate defconfig ====="
            make defconfig V=s

            echo "===== Save final config ====="
            cp -f .config "$GITHUB_WORKSPACE/logs/07_final.config"

            echo "===== Check important packages in final .config ====="
            grep -E 'CONFIG_PACKAGE_(luci-app-diskman|luci-i18n-diskman|lucky|luci-app-lucky|luci-app-turboacc|kmod-nft-offload|kmod-tcp-bbr|kmod-nft-fullcone|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|nlbwmon|luci-app-nlbwmon|luci-app-eqosplus|kmod-ifb|tc-tiny|bc|shortcut-fe|fast-classifier)' .config || true
            grep -E '^# CONFIG_PACKAGE_(luci-app-diskman|luci-i18n-diskman|lucky|luci-app-lucky|luci-app-turboacc|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs|nlbwmon|luci-app-nlbwmon|luci-app-eqosplus|kmod-ifb|tc-tiny|bc|shortcut-fe|fast-classifier)' .config || true

            require_config() {
              local key="$1"
              if grep -q "^${key}=y" .config; then
                echo "OK: ${key}=y"
              else
                echo "ERROR: missing ${key}=y"
                grep -E "^${key}=|^# ${key} is not set" .config || true
                exit 1
              fi
            }

            echo "===== Required main packages ====="
            require_config CONFIG_TARGET_mediatek
            require_config CONFIG_TARGET_mediatek_filogic
            require_config CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m
            require_config CONFIG_TARGET_ROOTFS_SQUASHFS

            require_config CONFIG_PACKAGE_luci
            require_config CONFIG_PACKAGE_luci-i18n-base-zh-cn
            require_config CONFIG_PACKAGE_luci-theme-argon
            require_config CONFIG_PACKAGE_openssh-sftp-server
            require_config CONFIG_PACKAGE_ttyd
            require_config CONFIG_PACKAGE_luci-app-ttyd
            require_config CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn

            require_config CONFIG_PACKAGE_openlist
            require_config CONFIG_PACKAGE_luci-app-openlist
            require_config CONFIG_PACKAGE_luci-i18n-openlist-zh-cn

            require_config CONFIG_PACKAGE_lucky
            require_config CONFIG_PACKAGE_luci-app-lucky

            require_config CONFIG_PACKAGE_luci-app-turboacc
            require_config CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING
            require_config CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_BBR_CCA
            require_config CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_NFT_FULLCONE
            require_config CONFIG_PACKAGE_kmod-nft-offload
            require_config CONFIG_PACKAGE_kmod-tcp-bbr
            require_config CONFIG_PACKAGE_kmod-nft-fullcone

            require_config CONFIG_PACKAGE_nlbwmon
            require_config CONFIG_PACKAGE_luci-app-nlbwmon
            require_config CONFIG_PACKAGE_luci-app-eqosplus
            require_config CONFIG_PACKAGE_kmod-ifb
            require_config CONFIG_PACKAGE_tc-tiny
            require_config CONFIG_PACKAGE_bc

            require_config CONFIG_PACKAGE_luci-app-diskman
            require_config CONFIG_PACKAGE_luci-i18n-diskman-zh-cn
            require_config CONFIG_PACKAGE_luci-compat
            require_config CONFIG_PACKAGE_luci-lua-runtime
            require_config CONFIG_PACKAGE_luci-lib-base
            require_config CONFIG_PACKAGE_luci-lib-nixio
            require_config CONFIG_PACKAGE_luci-lib-ip
            require_config CONFIG_PACKAGE_luci-lib-jsonc
            require_config CONFIG_PACKAGE_luci-lib-ipkg
            require_config CONFIG_PACKAGE_lua
            require_config CONFIG_PACKAGE_libubus-lua
            require_config CONFIG_PACKAGE_liblucihttp-lua
            require_config CONFIG_PACKAGE_ucode-mod-lua
            require_config CONFIG_PACKAGE_parted
            require_config CONFIG_PACKAGE_fdisk
            require_config CONFIG_PACKAGE_blkid
            require_config CONFIG_PACKAGE_lsblk
            require_config CONFIG_PACKAGE_e2fsprogs
            require_config CONFIG_PACKAGE_kmod-fs-ext4
            require_config CONFIG_PACKAGE_kmod-fs-f2fs
            require_config CONFIG_PACKAGE_f2fs-tools
            require_config CONFIG_PACKAGE_f2fsck
            require_config CONFIG_PACKAGE_mkf2fs
            require_config CONFIG_PACKAGE_mount-utils
            require_config CONFIG_PACKAGE_smartmontools

            require_config CONFIG_PACKAGE_bash
            require_config CONFIG_PACKAGE_curl
            require_config CONFIG_PACKAGE_wget-ssl
            require_config CONFIG_PACKAGE_htop
            require_config CONFIG_PACKAGE_tcpdump
            require_config CONFIG_PACKAGE_iperf3
            require_config CONFIG_PACKAGE_mtr-json
            require_config CONFIG_PACKAGE_bind-dig

            require_config CONFIG_PACKAGE_kmod-mt76
            require_config CONFIG_PACKAGE_kmod-mt7915e
            require_config CONFIG_PACKAGE_wpad-basic-mbedtls
            require_config CONFIG_PACKAGE_wireless-regdb

            require_config CONFIG_PACKAGE_usbutils
            require_config CONFIG_PACKAGE_kmod-usb-net
            require_config CONFIG_PACKAGE_kmod-usb-net-cdc-ether
            require_config CONFIG_PACKAGE_kmod-usb-net-rndis
            require_config CONFIG_PACKAGE_kmod-usb-net-cdc-ncm

            echo "===== Forbidden packages ====="
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_CM=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_SHORTCUT_FE_DRV=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-argon-config=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-openclash=y' .config
            ! grep -q '^CONFIG_PACKAGE_dockerd=y' .config
            ! grep -q '^CONFIG_PACKAGE_luci-app-dockerman=y' .config

            echo "===== Package tree checks ====="
            test -d package/luci-theme-argon
            test -d package/lucky
            test -d package/turboacc
            test -d package/luci-app-eqosplus
            test -d package/openlist
            test -d package/luci-app-diskman
            test -d feeds/packages/lang/golang
            test -f package/luci-app-eqosplus/Makefile
            test -f package/turboacc/luci-app-turboacc/Makefile
            test -f package/turboacc/nft-fullcone/Makefile

            echo "===== Embedded files ====="
            find files -type f | sort
            test -f files/etc/uci-defaults/01-enable-wifi
            test -f files/etc/uci-defaults/02-set-argon-theme
            test -f files/etc/uci-defaults/03-disable-lucky-autostart
            test -f files/etc/uci-defaults/04-config-turboacc
            test -f files/www/luci-static/resources/view/status/include/10_system.js

            bad_files="$(find files -type f | sort | grep -v -E '^(files/etc/uci-defaults/01-enable-wifi|files/etc/uci-defaults/02-set-argon-theme|files/etc/uci-defaults/03-disable-lucky-autostart|files/etc/uci-defaults/04-config-turboacc|files/www/luci-static/resources/view/status/include/10_system.js)$' || true)"
            if [ -n "$bad_files" ]; then
              echo "ERROR: unexpected embedded files:"
              echo "$bad_files"
              exit 1
            fi

            echo "Validate passed."
          } 2>&1 | tee logs/07_diy_part2_and_defconfig.log

      - name: Download sources
        run: |
          {
            echo "===== Download sources ====="
            date
            cd openwrt
            make download -j8 V=s
          } 2>&1 | tee logs/08_download.log

      - name: Build OpenWrt
        run: |
          {
            echo "===== Build OpenWrt ====="
            date
            cd openwrt

            echo "===== First build: make -j4 V=s ====="
            set +e
            make -j4 V=s
            rc="$?"
            set -e

            if [ "$rc" -ne 0 ]; then
              echo "===== make -j4 failed with rc=$rc, retry single thread ====="
              make -j1 V=s
            fi

            echo "===== Build done ====="
            date
          } 2>&1 | tee logs/09_compile.log

      - name: Prepare firmware files
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        run: |
          {
            echo "===== Prepare firmware files ====="
            date
            mkdir -p release-files

            if [ -d openwrt/bin/targets ]; then
              find openwrt/bin/targets -type f \
                \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.itb" -o -name "*.manifest" -o -name "*.buildinfo" -o -name "*.json" -o -name "*.sha256sums" \) \
                -exec cp -f {} release-files/ \;
            fi

            echo "===== release-files ====="
            find release-files -type f -exec ls -lah {} \; 2>/dev/null | sort || true
          } 2>&1 | tee logs/10_prepare_firmware.log

      - name: Validate firmware manifest
        if: ${{ always() }}
        run: |
          {
            echo "===== Validate firmware manifest ====="
            date

            manifest="$(find release-files openwrt/bin/targets -type f -name '*.manifest' 2>/dev/null | head -n 1 || true)"

            if [ -z "$manifest" ]; then
              echo "::warning::manifest not found"
              find release-files openwrt/bin/targets -type f 2>/dev/null | sort || true
              exit 0
            fi

            echo "manifest=$manifest"

            echo "===== important packages in manifest ====="
            grep -Ei 'diskman|lucky|turboacc|fullcone|offload|bbr|nlbwmon|eqos|ifb|tc-tiny|^bc|f2fs|mkf2fs|kmod-fs|shortcut|fast-classifier' "$manifest" || true

            require_manifest() {
              local pattern="$1"
              local name="$2"
              if ! grep -Eq "$pattern" "$manifest"; then
                echo "ERROR: $name not found in manifest"
                grep -Ei "$name" "$manifest" || true
                exit 1
              fi
            }

            require_manifest '^(lucky|luci-app-lucky)([[:space:]-]|$)' 'lucky'
            require_manifest '^(luci-app-turboacc)([[:space:]-]|$)' 'luci-app-turboacc'
            require_manifest '^(kmod-nft-offload)([[:space:]-]|$)' 'kmod-nft-offload'
            require_manifest '^(kmod-tcp-bbr)([[:space:]-]|$)' 'kmod-tcp-bbr'
            require_manifest '^(kmod-nft-fullcone)([[:space:]-]|$)' 'kmod-nft-fullcone'
            require_manifest '^(nlbwmon|luci-app-nlbwmon)([[:space:]-]|$)' 'nlbwmon'
            require_manifest '^(luci-app-eqosplus|kmod-ifb|tc-tiny|bc)([[:space:]-]|$)' 'eqosplus'
            require_manifest '^(kmod-fs-f2fs)([[:space:]-]|$)' 'kmod-fs-f2fs'
            require_manifest '^(f2fs-tools)([[:space:]-]|$)' 'f2fs-tools'
            require_manifest '^(f2fsck)([[:space:]-]|$)' 'f2fsck'
            require_manifest '^(mkf2fs)([[:space:]-]|$)' 'mkf2fs'

            if grep -Eiq '^(kmod-fast-classifier|kmod-shortcut-fe|kmod-shortcut-fe-cm|kmod-shortcut-fe-drv)([[:space:]-]|$)' "$manifest"; then
              echo "ERROR: Shortcut-FE related package found in no-SFE manifest:"
              grep -Ei '^(kmod-fast-classifier|kmod-shortcut-fe|kmod-shortcut-fe-cm|kmod-shortcut-fe-drv)([[:space:]-]|$)' "$manifest" || true
              exit 1
            fi

            forbidden='^(btrfs-progs|kmod-fs-btrfs|kmod-fs-exfat|kmod-fs-msdos|kmod-fs-ntfs3|kmod-fs-vfat|dosfstools|exfat-fsck|exfat-mkfs|ntfs-3g-utils|kmod-usb-storage|kmod-usb-storage-uas|block-mount)([[:space:]-]|$)'

            if grep -Eq "$forbidden" "$manifest"; then
              echo "::warning::forbidden-like packages found in firmware manifest:"
              grep -E "$forbidden" "$manifest" || true

              if [ "$STRICT_MANIFEST_CHECK" = "true" ]; then
                echo "STRICT_MANIFEST_CHECK=true, fail now."
                exit 1
              else
                echo "STRICT_MANIFEST_CHECK=false, treat as warning only."
              fi
            else
              echo "Manifest validate passed."
            fi
          } 2>&1 | tee logs/11_validate_manifest.log

      - name: Collect diagnostics
        if: ${{ always() }}
        run: |
          set +e
          mkdir -p diagnostics/openwrt diagnostics/logs
          cp -a logs diagnostics/logs 2>/dev/null || true

          if [ -d openwrt ]; then
            cd openwrt
            cp -f .config "$GITHUB_WORKSPACE/diagnostics/openwrt/dot_config.txt" 2>/dev/null || true
            ./scripts/diffconfig.sh > "$GITHUB_WORKSPACE/diagnostics/openwrt/diffconfig.txt" 2>&1 || true

            {
              echo "===== git ====="
              git log -1 --oneline 2>/dev/null || true
              git status --short 2>/dev/null || true
              echo
              echo "===== files ====="
              find files -type f -print -exec sed -n '1,220p' {} \; 2>/dev/null || true
              echo
              echo "===== package grep ====="
              grep -E 'CONFIG_PACKAGE_(nlbwmon|luci-app-nlbwmon|luci-app-eqosplus|kmod-ifb|tc-tiny|bc|luci-app-turboacc|kmod-nft-offload|kmod-tcp-bbr|kmod-nft-fullcone|kmod-fs-f2fs|f2fs-tools|f2fsck|mkf2fs)' .config || true
              echo
              echo "===== outputs ====="
              find bin/targets -type f -exec ls -lah {} \; 2>/dev/null | sort || true
              echo
              echo "===== manifests ====="
              for f in $(find bin/targets -type f -name '*.manifest' 2>/dev/null | sort); do
                echo "----- $f -----"
                cat "$f"
              done
            } > "$GITHUB_WORKSPACE/diagnostics/openwrt/summary.txt" 2>&1
          fi

          tar -czf OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz diagnostics logs release-files 2>/dev/null || true
          ls -lah OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz 2>/dev/null || true

      - name: Upload full diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Full_Diagnostics_${{ github.run_number }}
          path: |
            OpenWrt_full_diagnostics_${{ github.run_number }}.tar.gz
            diagnostics/**
            logs/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Upload firmware artifact
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Firmware_${{ github.run_number }}
          path: release-files/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Generate release tag
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' }}
        run: |
          echo "RELEASE_TAG=OpenWrt_F50_Monitor_EQOS_Temp_$(date +'%Y%m%d_%H%M%S')" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          body: |
            RAX3000M F50 build with Lucky, Turbo ACC no-SFE, F2FS /dev/fitrw support, traffic monitor, EQOS Plus and LuCI temperature display.

            Included:
            - F50 basic USB Ethernet drivers
            - WiFi
            - SFTP
            - ttyd
            - luci-theme-argon
            - OpenList
            - patched minimal DiskMan LuCI package
            - F2FS support for /dev/fitrw persistent overlay
            - kmod-fs-f2fs
            - f2fs-tools
            - mkf2fs
            - f2fsck
            - lucky
            - luci-app-lucky
            - Turbo ACC no-SFE
            - Flow Offload
            - Hardware Flow Offload
            - FullCone NAT
            - BBR CCA
            - nlbwmon
            - luci-app-nlbwmon
            - luci-app-eqosplus
            - kmod-ifb
            - tc-tiny
            - bc
            - LuCI overview temperature display through files/www/luci-static/resources/view/status/include/10_system.js

            Notes:
            - Lucky is installed but disabled from boot.
            - Turbo ACC is installed in no-SFE mode.
            - Shortcut-FE / SFE is intentionally disabled.
            - nlbwmon is included for IPv4 / IPv6 / per-host traffic monitoring.
            - EQOS Plus is included for per-device bandwidth control.
            - LuCI system overview scans thermal_zone and hwmon nodes for CPU / WiFi temperature.
            - If WiFi temperature nodes are exposed, the system page can show values like CPU: 47.6°C, WiFi: 28.0°C 28.0°C.
            - For accurate EQOS Plus rate limiting, disable Turbo ACC flow offload / hardware flow offload during testing.
          files: release-files/*
          draft: false
          prerelease: false
