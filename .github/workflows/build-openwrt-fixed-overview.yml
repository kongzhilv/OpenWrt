name: Build OpenWrt Netdata EQOS

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - make
      - fix-rax3000m-emmc-target
    paths-ignore:
      - "*.md"
      - "LICENSE"

permissions:
  contents: write

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.1
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DIY_P3_SH: diy-part3-overlay.sh
  UPLOAD_FIRMWARE: "true"
  UPLOAD_RELEASE: "true"
  TZ: Asia/Shanghai
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: build-netdata-eqos
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          mkdir -p logs release-files diagnostics
          {
            echo "===== Required files ====="
            test -f "$CONFIG_FILE"
            test -f "$DIY_P1_SH"
            test -f "$DIY_P2_SH"
            test -f "$DIY_P3_SH"
            test -f scripts/patches/patch-eqosplus-mac-ipv6.sh
            test -f files/etc/uci-defaults/01-enable-wifi
            test -f files/etc/uci-defaults/02-set-argon-theme
            test -f files/etc/uci-defaults/10-network-accel-defaults
            test -f files/etc/uci-defaults/20-enable-netdata
            test -f files/etc/uci-defaults/21-app-service-defaults
            test -f files/etc/uci-defaults/30-netdata-zh
            test -f files/etc/uci-defaults/40-enable-netdata-openwrt-clients
            test -f files/etc/config/netdata_clients
            test -f files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
            find . -maxdepth 3 -type f | sort
          } 2>&1 | tee logs/01_required_files.log

      - name: Free disk space
        timeout-minutes: 15
        run: |
          {
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
            docker image prune --all --force || true
            sudo timedatectl set-timezone "$TZ" || true
            df -h
          } 2>&1 | tee logs/02_free_disk_space.log

      - name: Install build dependencies
        timeout-minutes: 60
        run: |
          {
            sudo apt-get update
            sudo apt-get -y install \
              build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
              gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip \
              zlib1g-dev file wget curl swig python3-dev qemu-utils libfuse-dev
          } 2>&1 | tee logs/03_install_dependencies.log

      - name: Clone OpenWrt source
        run: |
          git clone -b "$REPO_BRANCH" --depth 1 "$REPO_URL" openwrt
          cd openwrt
          git log -1 --oneline | tee "$GITHUB_WORKSPACE/logs/03b_clone_openwrt.log"

      - name: DIY part 1
        run: |
          chmod +x "$DIY_P1_SH"
          cd openwrt
          "$GITHUB_WORKSPACE/$DIY_P1_SH" 2>&1 | tee "$GITHUB_WORKSPACE/logs/04_diy_part1.log"

      - name: Update feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/05_feeds_update.log"

      - name: Install feeds
        run: |
          cd openwrt
          ./scripts/feeds install -a 2>&1 | tee "$GITHUB_WORKSPACE/logs/06_feeds_install.log"

      - name: DIY part 2, overlay part 3 and defconfig
        run: |
          chmod +x "$DIY_P2_SH" "$DIY_P3_SH"
          cp -f "$GITHUB_WORKSPACE/$CONFIG_FILE" openwrt/.config

          cd openwrt

          "$GITHUB_WORKSPACE/$DIY_P2_SH" 2>&1 | tee "$GITHUB_WORKSPACE/logs/07a_diy_part2.log"
          "$GITHUB_WORKSPACE/$DIY_P3_SH" 2>&1 | tee "$GITHUB_WORKSPACE/logs/07b_diy_part3_overlay.log"

          rm -rf tmp
          make defconfig V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/07c_defconfig.log"

          cp -f .config "$GITHUB_WORKSPACE/logs/07_final.config"

          echo "===== Selected monitor / turbo / eqos config ====="
          grep -E 'CONFIG_PACKAGE_(rpcd-mod-file|netdata|wrtbwmon|luci-app-wrtbwmon|iptables-nft|ip6tables-nft|xtables-nft|luci-app-eqosplus|luci-app-turboacc|kmod-nft-offload|kmod-tcp-bbr|kmod-nft-fullcone)' .config || true

          grep -q '^CONFIG_PACKAGE_netdata=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-eqosplus=y' .config
          grep -q '^CONFIG_PACKAGE_iptables-nft=y' .config
          grep -q '^CONFIG_PACKAGE_ip6tables-nft=y' .config
          grep -q '^CONFIG_PACKAGE_xtables-nft=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-turboacc_INCLUDE_OFFLOADING=y' .config
          grep -q '^CONFIG_PACKAGE_kmod-nft-offload=y' .config
          if grep -q '^CONFIG_PACKAGE_wrtbwmon=y' .config; then echo 'ERROR: wrtbwmon should be disabled'; exit 1; fi
          if grep -q '^CONFIG_PACKAGE_luci-app-wrtbwmon=y' .config; then echo 'ERROR: luci-app-wrtbwmon should be disabled'; exit 1; fi
          if grep -q '^CONFIG_PACKAGE_luci-wrtbwmon=y' .config; then echo 'ERROR: luci-wrtbwmon should be disabled'; exit 1; fi

          echo "===== EQOS backend validation ====="
          test -f package/luci-app-eqosplus/root/usr/bin/eqosplus
          grep -q "grep -oE '\[0-9\]+'" package/luci-app-eqosplus/root/usr/bin/eqosplus
          grep -q "fq_codel limit 256 flows 128" package/luci-app-eqosplus/root/usr/bin/eqosplus
          grep -q "txqueuelen 1000" package/luci-app-eqosplus/root/usr/bin/eqosplus
          grep -q "protocol ipv6" package/luci-app-eqosplus/root/usr/bin/eqosplus
          if grep -q "grep -o '\[0-9\]'" package/luci-app-eqosplus/root/usr/bin/eqosplus; then echo 'ERROR: EQOS still splits multi-digit device indexes'; exit 1; fi
          if grep -q "sfq perturb 10" package/luci-app-eqosplus/root/usr/bin/eqosplus; then echo 'ERROR: EQOS still uses sfq leaf qdisc'; exit 1; fi

          echo "===== Embedded files ====="
          find files -type f | sort

          test -f files/etc/uci-defaults/10-network-accel-defaults
          test -f files/etc/uci-defaults/20-enable-netdata
          test -f files/etc/uci-defaults/30-netdata-zh
          test -f files/etc/uci-defaults/40-enable-netdata-openwrt-clients
          test -f files/etc/config/netdata_clients
          test -f files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "keep offload available but disabled by default" files/etc/uci-defaults/10-network-accel-defaults
          grep -q "flow_offloading='0'" files/etc/uci-defaults/10-network-accel-defaults
          grep -q "flow_offloading_hw='0'" files/etc/uci-defaults/10-network-accel-defaults
          grep -q "sw_flow='0'" files/etc/uci-defaults/10-network-accel-defaults
          grep -q "hw_flow='0'" files/etc/uci-defaults/10-network-accel-defaults
          grep -q "skip Netdata static web asset translation" files/etc/uci-defaults/30-netdata-zh
          grep -q "clean_openwrt_clients_state" files/etc/uci-defaults/40-enable-netdata-openwrt-clients
          grep -q "openwrt_clients chart DBs" files/etc/uci-defaults/40-enable-netdata-openwrt-clients
          grep -q "option update_every '3'" files/etc/config/netdata_clients
          grep -q "1/3/5/10" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q 'CHART_NS="openwrt_clients_zh"' files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q 'CHART_CONTEXT="openwrt_clients_zh.client_rate"' files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "DIMENSION download4 'IPv4下载'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "DIMENSION upload4 'IPv4上传'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "DIMENSION download6 'IPv6下载'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "DIMENSION upload6 'IPv6上传'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "ip6 saddr" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q "ip6 daddr" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q 'TABLE="openwrt_clients"' files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q 'nft add table inet "\$TABLE"' files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          grep -q 'nft add chain inet "\$TABLE" "\$CHAIN"' files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin
          if grep -q "DIMENSION download 'Download'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin; then echo 'ERROR: English download dimension remains'; exit 1; fi
          if grep -q "DIMENSION upload 'Upload'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin; then echo 'ERROR: English upload dimension remains'; exit 1; fi
          if grep -q "DIMENSION download '下载'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin; then echo 'ERROR: old unsplit Chinese download dimension remains'; exit 1; fi
          if grep -q "DIMENSION upload '上传'" files/usr/libexec/netdata/plugins.d/openwrt_clients.plugin; then echo 'ERROR: old unsplit Chinese upload dimension remains'; exit 1; fi
          if [ -f files/etc/config/eqosplus ]; then echo 'ERROR: files/etc/config/eqosplus must not be embedded'; exit 1; fi
          if grep -R "192\.168\.2\." files 2>/dev/null; then echo 'ERROR: repository overlay must not embed real 192.168.2.x client rules'; exit 1; fi

      - name: Download sources
        run: |
          cd openwrt
          make download -j8 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/08_download.log"

      - name: Build OpenWrt
        run: |
          cd openwrt

          set +e
          make -j4 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/09_compile_j4.log"
          rc=${PIPESTATUS[0]}
          set -e

          if [ "$rc" -ne 0 ]; then
            make -j1 V=s 2>&1 | tee "$GITHUB_WORKSPACE/logs/09_compile_j1.log"
          fi

      - name: Prepare firmware files
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        run: |
          mkdir -p release-files
          if [ -d openwrt/bin/targets ]; then
            find openwrt/bin/targets -type f \
              \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.itb" -o -name "*.manifest" -o -name "*.buildinfo" -o -name "*.json" -o -name "*.sha256sums" \) \
              -exec cp -f {} release-files/ \;
          fi

          find release-files -type f -exec ls -lah {} \; 2>/dev/null | sort || true

      - name: Create GitHub Release
        if: ${{ success() && env.UPLOAD_RELEASE == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! find release-files -type f \( -name "*.bin" -o -name "*.img" -o -name "*.img.gz" -o -name "*.itb" \) | grep -q .; then
            echo "No firmware image found; skip release."
            exit 0
          fi

          tag="OpenWrt_Netdata_EQOS_$(date +'%Y%m%d_%H%M%S')_${GITHUB_RUN_NUMBER}"
          notes="/tmp/${tag}.md"
          {
            echo "# ${tag}"
            echo
            echo "- Repository: ${GITHUB_REPOSITORY}"
            echo "- Workflow run: ${GITHUB_RUN_NUMBER}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Target branch: ${GITHUB_REF_NAME}"
            echo
            echo "## Firmware files"
            find release-files -maxdepth 1 -type f -printf '- %f\n' | sort
          } > "$notes"

          gh release create "$tag" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$tag" \
            --notes-file "$notes"

      - name: Upload firmware artifact
        if: ${{ always() && env.UPLOAD_FIRMWARE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Firmware_Netdata_EQOS_${{ github.run_number }}
          path: release-files/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Upload diagnostics artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_Netdata_EQOS_Diagnostics_${{ github.run_number }}
          path: logs/**
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
